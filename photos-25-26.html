  <style type="text/css">
    .image {
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .image:hover {opacity: 0.7;}

    @media all and (orientation: portrait) {
      .image {
        width: 100%;
        aspect-ratio: auto;
      }
    }

    @media all and (orientation: landscape) {
      .image {
        height: 30vh;
        aspect-ratio: auto;
      }
    }

    /* The Modal (background) */
    .modal {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      z-index: 10; /* Sit on top; the navbar has a z-index of 5 */
      padding-top: 80px; /* Location of the box */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgb(0,0,0); /* Fallback color */
      background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
    }

    /* Modal Content (image) */
    .modal-content {
      margin: auto;
      display: block;
      max-width: 75vw;
      max-height: 75vh;
    }

    /* Caption of Modal Image */
    #caption {
      margin: auto;
      display: block;
      width: 80%;
      max-width: 700px;
      text-align: center;
      color: #ccc;
      padding: 10px 0;
      height: 150px;
    }

    /* Add Animation */
    .modal-content, #caption {  
      -webkit-animation-name: zoom;
      -webkit-animation-duration: 0.3s;
      animation-name: zoom;
      animation-duration: 0.3s;
    }

    @-webkit-keyframes zoom {
      from {-webkit-transform:scale(0)} 
      to {-webkit-transform:scale(1)}
    }

    @keyframes zoom {
      from {transform:scale(0)} 
      to {transform:scale(1)}
    }

    /* 100% Image Width on Smaller Screens */
    @media only screen and (max-width: 700px){
      .modal-content {
        width: 100%;
      }
    }
  </style>
</head>

  <!-- The Modal -->
  <div id="myModal" class="modal">
    <img class="modal-content" id="img01">
    <div id="caption"></div>
  </div>

  <script>
    // Get the modal
    var modal = document.getElementById("myModal");

    // Get the image and insert it inside the modal - use its "alt" text as a caption
    var modalImg = document.getElementById("img01");
    var captionText = document.getElementById("caption");
    function modaldisplay(inputpicture){
      modal.style.display = "block";
      modalImg.src = inputpicture.src;
      captionText.innerHTML = inputpicture.alt;
    }

    // When the user clicks on the modal or the image displayed in it, close the modal
    modal.onclick = function() { 
      modal.style.display = "none";
    }
    modalImg.onclick = function() { 
      modal.style.display = "none";
    }
  </script>
